site_name: OmniVault
site_description: Unified Go library for secret management across multiple providers
site_url: https://plexusone.github.io/omnivault
repo_url: https://github.com/plexusone/omnivault
repo_name: plexusone/omnivault

docs_dir: docs

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Library:
      - Quick Start: library/quickstart.md
      - Client API: library/client.md
      - URI Resolver: library/resolver.md
      - Providers: library/providers.md
      - Custom Providers: library/custom-providers.md
  - CLI:
      - Quick Start: cli/quickstart.md
      - Commands: cli/commands.md
      - Configuration: cli/configuration.md
      - Daemon: cli/daemon.md
      - Security: cli/security.md
  - Releases:
      - v0.6.0: releases/v0.6.0.md
      - v0.5.0: releases/v0.5.0.md
      - v0.4.0: releases/v0.4.0.md
      - v0.3.0: releases/v0.3.0.md
      - v0.2.1: releases/v0.2.1.md
      - v0.2.0: releases/v0.2.0.md
      - v0.1.0: releases/v0.1.0.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plexusone/omnivault
